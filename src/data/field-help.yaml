# Инлайн-подсказки по полям (T-803).
#
# Формат: простые строки `<ключ>: <однострочная подсказка>`. Без вложенности,
# без кавычек, без многострочных строк. YAML читается при запуске обоими
# UI-хостами (через `OldenEra.Generator.Services.FieldHelpCatalog`) и
# показывается как атрибут `title=` у соответствующего input/label в Web и как
# WPF `ToolTip` у эквивалентного контрола.
#
# Ключи повторяют идентификаторы `ValidationFieldKeys`, где такие уже есть;
# новые ключи только для документации добавляются в `FieldHelpKeys` и следуют
# той же форме `категория.подкатегория.поле`. Держите сообщения короткими —
# одно предложение, простой русский язык, без эмодзи. Строки, начинающиеся с
# `#`, — комментарии; пустые строки игнорируются.
#
# Если файл отсутствует, повреждён или ключа нет в нём, каталог возвращает
# null и хост не показывает подсказку — поведение по умолчанию не меняется.

# ── Основы карты ──────────────────────────────────────────────────────────
template.name: Отображаемое имя, которое попадает в .rmg.json как `name` и видно в списке шаблонов в игре.
map.size: Длина стороны квадратной карты в клетках. Штатные шаблоны используют 96–240; значения выше 240 помечены как экспериментальные и могут подвесить движок.
map.players: Количество слотов игроков (людей и ИИ). Каждый слот получает свою зону игрока; суммарное число зон (игроки + нейтральные) не может превышать лимит движка в 32.
topology: Схема соединения зон между собой. Balanced расставляет зоны равномерно по кольцу; Hub-and-Spoke добавляет центральную хаб-зону; Default соединяет зоны по кругу, Chain выстраивает их цепью.
seed: Необязательный целочисленный сид. Один и тот же сид при одинаковых настройках даёт одну и ту же карту; оставьте пустым для недетерминированной генерации.

# ── Зоны (базовые) ────────────────────────────────────────────────────────
zones.neutral.count: Количество ничейных зон, размещаемых между игроками. Больше нейтральных зон — дольше исследование и больше буфер между конфликтующими игроками.
zones.total: Суммарное число зон (игроки + нейтральные, плюс хаб-зона в топологии Hub-and-Spoke). Лимит движка — 32.
zones.player.castles: Замки в стартовой зоне каждого игрока. Штатные шаблоны используют 1; значение выше 1 при суммарном числе зон больше 10 может подвесить движок при загрузке.
zones.minSeparation: Минимальное число нейтральных зон, которое раскладка обязана поместить между любыми двумя зонами игроков. Соблюдается, только если топология, число нейтральных зон и настройки порталов позволяют это геометрически.
zones.player.size: Множитель размера зон игроков в advanced-режиме. 1.0x — дефолт движка; меньшие значения сжимают домашнюю зону, большие — расширяют.
zones.neutral.size: Множитель размера нейтральных зон в advanced-режиме. 1.0x — дефолт движка.

# ── Стража ────────────────────────────────────────────────────────────────
guards.randomization: Насколько сила каждого стража отклоняется от цели своей зоны. 0% — каждый страж точно в цель; 50% — допустимо отклонение до половины силы в обе стороны.
guards.multiplier: Множитель базовой цели стражи зоны. 1.0x — дефолт движка; повышение делает зону жёстче, чем её уровень.
connection.guardRandomization: Переопределение рандомизации стражи для отдельных соединений (монолиты/порталы между зонами). Пусто — наследуется дефолт шаблона.
connection.defaults.guardRandomization: Общий для шаблона дефолт рандомизации стражи соединений. Каждое соединение наследует это значение, если не задаёт своё.

# ── Герои ─────────────────────────────────────────────────────────────────
hero.minMax: Минимальное и максимальное число героев, которое движок может разместить каждому игроку. Минимум не может превышать максимум.
hero.bans: Герои, исключённые из случайного выбора. Бан всех героев фракции может оставить фракцию без стартового героя.
hero.lighting: Освещает ли каждый герой местность ночью. Выключено соответствует «чёрному туману» оригинальной Heroes 3; включено — современным дефолтам Olden Era.
hero.lightingDay: Освещают ли герои местность также днём. Большинство шаблонов держит это включённым.

# ── Условия победы / правила игры ─────────────────────────────────────────
gameRules.cityHold: Условие победы «Удержание города». Требует хотя бы одну нейтральной зоны (или топологию «Хаб»), чтобы движку было куда поместить удерживаемый город.
gameRules.victoryCondition: Идентификатор условия победы движка. `win_condition_5` — Удержание города; `win_condition_6` — Турнир (ровно 2 игрока).

# ── Бонусы ────────────────────────────────────────────────────────────────
bonuses.perPlayerOverrides: Переопределения стартового бонуса по слотам. Слоты вне диапазона, дубликаты и пустые строки игнорируются при эмите.

# ── Контент зон ───────────────────────────────────────────────────────────
zoneContent.pool: Совокупный пул SID и списков контента, достижимый из этого шаблона. Валидатор предупреждает, если недостижимы категории, на которые движок обычно рассчитывает (шахты, святилища, банки, жилища 7-го уровня).
zoneContent.includeLists: Готовые списки контента, подтягивающие в зону связки объектов (например, `units_banks`, `random_hires_tier_7`). Пусто — используются только явно заданные SID.
zoneContent.density: Множитель бюджета контента зоны. 1.0x — дефолт движка; меньшие значения разгружают зону, большие — наполняют её объектами.

# ── Границы и дороги ──────────────────────────────────────────────────────
borders.water: Ширина водной границы вокруг карты. 0 полностью отключает водную рамку.
borders.noise: Величина дрожания (джиттера) краёв границы. Больше значение — более изрезанная береговая линия.
roads.style: Пресет дорог движка (булыжник, грунт, гравий). Влияет на стоимость движения и внешний вид.
roads.density: Насколько активно генератор прокладывает дороги между зонами. 0 отключает дороги; большие значения связывают больше зон.

# ── Экспериментальные ─────────────────────────────────────────────────────
encounterHoles.enabled: Если включено, генератор время от времени проделывает прорехи в формированиях стражей, чтобы стражи дропали меньше добычи, чем обещает их ценность. Экспериментальная функция.
encounterHoles.affectedEncounters: Доля сражений, получающих прореху. 0.0 оставляет все сражения целыми; 1.0 проделывает прореху в каждом сражении.
encounterHoles.twoHoleEncounters: Доля сражений с прорехой, получающих вторую прореху. Складывается с долей по каждому сражению.
zoneOverrides.guardRandomization: Переопределение рандомизации стражи для отдельных зон. Пусто — наследуется глобальное значение advanced-режима.
zoneOverrides.guardMultiplier: Переопределение множителя силы стражи для отдельных зон. Пусто — наследуется дефолт уровня зоны.

# ── Каталог / предпросмотр ────────────────────────────────────────────────
preview.zoom: Масштаб экранного предпросмотра. На сгенерированный .rmg.json не влияет.
preset.load: Заменить текущие настройки встроенным пресетом шаблона. Локальные правки будут потеряны.
