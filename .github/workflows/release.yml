name: Release

# Релиз по тегу v*. Tauri-action собирает бандлы на всех трёх ОС,
# подписывает updater-артефакты и публикует GitHub Release с latest.json.
#
# Требуемые секреты репозитория:
#   TAURI_SIGNING_PRIVATE_KEY           — приватный minisign-ключ (см. README)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  — пароль ключа (пустой при генерации без пароля)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Существующий тег для повторной публикации"
        required: true

jobs:
  publish:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        settings:
          - os: windows-latest
            args: ""
          - os: macos-latest # Apple Silicon
            args: ""
          - os: macos-latest # Intel: кросс-компиляция с ARM-раннера (macos-13 доживает)
            args: "--target x86_64-apple-darwin"
          - os: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.settings.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.settings.args != '' && 'x86_64-apple-darwin' || '' }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Linux deps (webkit2gtk)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install dependencies
        run: npm ci

      - name: Publish release (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          args: ${{ matrix.settings.args }}
          releaseName: "Olden Era Templates ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: "Десктопный генератор шаблонов для Heroes of Might and Magic: Olden Era (Windows / macOS / Linux)."
          releaseDraft: false
          prerelease: false
